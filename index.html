// ─── HOOK ───
function useProgress() {
  const load = () => { try { return JSON.parse(localStorage.getItem("ks3")||"[]"); } catch { return []; } };
  const [done, setDone] = useState(load);
  const pct = Math.round(done.filter(id=>id<=14).length/14*100);
  const complete = id => setDone(prev => {
    if (prev.includes(id)) return prev;
    const n=[...prev,id]; localStorage.setItem("ks3",JSON.stringify(n)); return n;
  });
  const reset = () => { setDone([]); localStorage.removeItem("ks3"); };
  const earned = BADGES.filter(b=>b.req({d:done.length,p:pct}));
  return {done,pct,complete,reset,earned};
}

function TwoColSlide({left,right}) {

        </div>
      ))}

}
function SpecTable({title,headers,rows,color,highlights=[]}) {
  const isHL=(ri,ci)=>highlights.some(h=>h.row===ri&&h.col===ci);
  return (
    <div style={{marginBottom:12}}>
      {title&&<p style={{color:C.muted,fontSize:"0.66rem",fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:6}}>{title}</p>}
      <div style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(0,0,0,0.08)"}}>
        <div style={{display:"grid",gridTemplateColumns:`repeat(${headers.length},1fr)`,background:"#1F2A44",padding:"8px 11px"}}>
          {headers.map((h,i)=><span key={i} style={{color:"#fff",fontSize:"0.72rem",fontWeight:700}}>{h}</span>)}
        </div>
        {rows.map((row,ri)=>(
          <div key={ri} style={{display:"grid",gridTemplateColumns:`repeat(${headers.length},1fr)`,padding:"7px 11px",background:ri%2===0?"#fff":"rgba(0,0,0,0.02)",borderTop:"1px solid rgba(0,0,0,0.05)"}}>
            {row.map((cell,ci)=>{
              const hl=isHL(ri,ci);
              return (
                <span key={ci} style={{
                  fontSize:"0.76rem",
                  color: hl?"#fff": ci===0?C.text:C.muted,
                  fontWeight: hl||ci===0?700:400,
                  background: hl?color:"transparent",
                  borderRadius: hl?5:0,
                  padding: hl?"2px 7px":0,
                  display:"inline-block",
                }}>{cell}</span>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}
function Callout({children,style}) {
  return (
    <div style={{background:"rgba(0,0,0,0.04)",borderRadius:10,padding:"11px 14px",marginTop:10,...style}}>
      <p style={{color:C.text,fontWeight:700,fontSize:"0.82rem",lineHeight:1.7,margin:0}}>{children}</p>
    </div>
  );
}
function SlideCaption({children}) {
  return <p style={{color:C.faint,fontSize:"0.68rem",marginTop:7,lineHeight:1.6}}>{children}</p>;
}

function CompareGrid({left,right}) {

// ─── LIB CARD (복사 버튼 포함) ───
function LibCard({title,tags,code,color}) {
  const [copied,setCopied]=useState(false);
  const copy=()=>{ navigator.clipboard?.writeText(code).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }); };
  return (
    <div style={{background:"#fff",border:"1px solid "+color+"28",borderRadius:13,overflow:"hidden",marginBottom:12,boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}>

        <span style={{color:"#fff",fontWeight:800,fontSize:13}}>{title}</span>
        <div style={{display:"flex",gap:5}}>
          {tags.map(t=><span key={t} style={{background:"rgba(255,255,255,0.22)",color:"#fff",fontSize:10,fontWeight:700,padding:"1px 7px",borderRadius:100}}>{t}</span>)}
        </div>
      </div>
      <div style={{padding:"10px 13px 8px"}}>
        <pre style={{background:"#1E293B",borderRadius:8,padding:"10px 12px",fontFamily:"monospace",fontSize:11,color:"#E2E8F0",lineHeight:1.8,whiteSpace:"pre-wrap",margin:"0 0 8px",overflowX:"auto"}}>{code}</pre>
        <button onClick={copy} style={{width:"100%",padding:"7px",background:copied?"#16A34A":color+"18",border:"1px solid "+color+"30",borderRadius:8,color:copied?"#fff":color,fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{copied?"✓ 복사됨!":"📋 복사하기"}</button>
      </div>
    </div>
  );
}

// ─── COPY PROMPT HELPER ───
function CopyPrompt({color,prompt}) {
  const [copied,setCopied]=useState(false);
  const copy=()=>{ navigator.clipboard?.writeText(prompt).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }); };
  return (
    <div>
      <pre style={{background:"#1E293B",borderRadius:9,padding:"11px 13px",fontFamily:"monospace",fontSize:10,color:"#E2E8F0",lineHeight:1.85,whiteSpace:"pre-wrap",margin:"0 0 8px",overflowX:"auto"}}>{prompt}</pre>
      <button onClick={copy} style={{width:"100%",padding:"7px",background:copied?"#16A34A":color+"18",border:"1px solid "+color+"30",borderRadius:8,color:copied?"#fff":color,fontSize:12,fontWeight:700,cursor:"pointer",transition:"all .2s"}}>{copied?"✓ 복사됨!":"📋 복사하기"}</button>
    </div>
  );
}

function PptMagic({go}) {
  const [openSec,setOpenSec]=useState(0);
  const color='#1F2A44';
  const accent='#2E5C9E';
  const light='#EEF2FF';

  const SecCard=({idx,icon,title,sub,children})=>{
    const isOpen=openSec===idx;
    return (
      <div style={{background:'#fff',border:'1px solid '+(isOpen?accent+'80':'rgba(0,0,0,0.08)'),borderRadius:16,marginBottom:12,overflow:'hidden',boxShadow:isOpen?'0 4px 20px rgba(46,92,158,0.1)':'none',transition:'all .2s'}}>
        <button onClick={()=>setOpenSec(isOpen?-1:idx)} style={{width:'100%',background:isOpen?'linear-gradient(135deg,'+accent+'08,'+accent+'03)':'transparent',border:'none',padding:'18px 20px',cursor:'pointer',display:'flex',alignItems:'center',gap:14,textAlign:'left'}}>
          <div style={{width:44,height:44,borderRadius:12,background:isOpen?'linear-gradient(135deg,'+color+','+accent+')':'rgba(0,0,0,0.06)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0,transition:'all .2s'}}>{icon}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:'0.97rem',color:isOpen?color:'#1e293b'}}>{title}</div>
            <div style={{fontSize:12,color:'#64748b',marginTop:2}}>{sub}</div>
          </div>
          <span style={{fontSize:18,color:isOpen?accent:'#94a3b8',transition:'transform .2s',display:'inline-block',transform:isOpen?'rotate(180deg)':'none'}}>&#8964;</span>
        </button>
        {isOpen&&<div style={{padding:'0 20px 20px'}}>{children}</div>}
      </div>
    );
  };

  const CB=({children})=>{
    const [copied,setCopied]=useState(false);
    return (
      <div style={{position:'relative',margin:'10px 0'}}>
        <pre style={{background:'#1F2A44',color:'#93C5FD',borderRadius:10,padding:'14px 16px 14px 16px',fontSize:12,lineHeight:1.8,overflowX:'auto',whiteSpace:'pre-wrap',wordBreak:'break-word',paddingRight:90}}>{children}</pre>
        <button onClick={()=>{navigator.clipboard.writeText(children);setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={{position:'absolute',top:8,right:8,background:copied?'#16A34A':'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:6,padding:'4px 10px',color:'#fff',fontSize:10,fontWeight:700,cursor:'pointer',transition:'background .2s'}}>{copied?'✓ 복사됨':'📋 복사'}</button>
      </div>
    );
  };
  const SubH=({children})=>(
    <p style={{fontWeight:800,fontSize:'0.9rem',color:accent,margin:'16px 0 6px',borderLeft:'3px solid '+accent,paddingLeft:10}}>{children}</p>

  const Tip=({ic,text})=>(
    <div style={{display:'flex',gap:10,background:light,borderRadius:10,padding:'10px 14px',marginBottom:8,alignItems:'flex-start'}}>
      <span style={{fontSize:16,flexShrink:0}}>{ic||'💡'}</span>
      <p style={{fontSize:12,color:'#374151',margin:0,lineHeight:1.6}}>{text}</p>
    </div>
  );
  const Check=({items})=>(
    <div style={{background:'#F0F9FF',borderRadius:10,padding:'12px 14px',marginBottom:8}}>
      {items.map(({t,d})=>(
        <div key={t} style={{display:'flex',gap:10,marginBottom:8,alignItems:'flex-start'}}>
          <span style={{color:accent,fontSize:13,flexShrink:0,fontWeight:900}}>✓</span>
          <div><p style={{fontWeight:700,fontSize:12,color:'#1e293b',margin:'0 0 2px'}}>{t}</p><p style={{fontSize:11,color:'#6B7280',margin:0,lineHeight:1.5}}>{d}</p></div>
        </div>
      ))}
    </div>
  );

  return (
    <section style={{maxWidth:860,margin:'0 auto',padding:'32px 16px 60px'}}>

        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
          <span style={{fontSize:32}}>🪄</span>
          <span style={{background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.25)',borderRadius:100,padding:'3px 12px',color:'#BFDBFE',fontSize:11,fontWeight:800,letterSpacing:'0.08em'}}>AI 지휘관 가이드</span>
        </div>

        <p style={{color:'#93C5FD',fontSize:13,margin:'0 0 16px',lineHeight:1.7}}>스토리보드 설계 → 마스터 프롬프트 투입 → 임원급 결과물<br/>10단계 Step-by-Step 완전 정복</p>

// ─── AI COACH ───
function Coach({onClose}) {
  const initMsg={role:"assistant",content:"안녕하세요! 저는 **김실장 AI 학습 코치**입니다. 🤖\n\n프롬프트 엔지니어링이 처음이셔도 걱정 마세요. 어떤 점이 궁금하신가요?"};
  const [msgs,setMsgs]=useState([initMsg]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [apiKey,setApiKey]=useState(()=>localStorage.getItem("ks_api_key")||"");
  const [keyInput,setKeyInput]=useState("");
  const [showKeySetting,setShowKeySetting]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[msgs]);

  const saveKey=()=>{
    const k=keyInput.trim();
    if (!k) return;
    localStorage.setItem("ks_api_key",k);
    setApiKey(k);
    setKeyInput("");
    setShowKeySetting(false);
  };
  const clearKey=()=>{
    localStorage.removeItem("ks_api_key");
    setApiKey("");
    setShowKeySetting(false);
  };

  const send=useCallback(async(text)=>{
    const q=(text||input).trim();
    if (!q||loading||!apiKey) return;
    setInput("");
    const next=[...msgs,{role:"user",content:q}];
    setMsgs(next);
    setLoading(true);
    try {
      const history=next.map(m=>({role:m.role,content:m.content}));
      const sliced=history.length>10?history.slice(-10):history;
      const apiMsgs=sliced[0]?.role==="assistant"?sliced.slice(1):sliced;
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1024,system:COACH_SYS,messages:apiMsgs})
      });
      if (!res.ok) {
        const err=await res.json().catch(()=>({}));
        const msg=err?.error?.message||("오류 "+res.status);
        setMsgs(p=>[...p,{role:"assistant",content:"오류가 발생했습니다: "+msg+"\n\n💡 API 키를 확인하고 다시 시도해주세요. 🔄"}]);
        setLoading(false); return;
      }
      const data=await res.json();
      const reply=data.content?.map(c=>c.text||"").join("")||"잠시 후 다시 시도해주세요.";
      setMsgs(p=>[...p,{role:"assistant",content:reply}]);
    } catch(e) {
      setMsgs(p=>[...p,{role:"assistant",content:"네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요. 🔄"}]);
    }
    setLoading(false);
  },[msgs,input,loading,apiKey]);

  const quick=["AI 처음인데 어디서 시작할까요?","CEO 보고서 프롬프트 만들어줘","역할 지정하는 법 알려줘","ESG 분석 프롬프트 예시 줘"];
  const renderM=t=>t.split("\n").map((l,i)=><p key={i} style={{margin:"3px 0",lineHeight:1.7,fontSize:14}} dangerouslySetInnerHTML={{__html:l.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>")}} />);

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:1100,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(6px)"}}>
      <style>{"@keyframes db{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}"}</style>
      <div style={{background:"#fff",border:"1px solid rgba(99,102,241,0.2)",borderRadius:"22px 22px 0 0",width:"100%",maxWidth:640,height:"82vh",display:"flex",flexDirection:"column",boxShadow:"0 -12px 48px rgba(0,0,0,.15)"}}>
        <div style={{padding:"15px 20px",borderBottom:"1px solid rgba(0,0,0,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:38,height:38,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:17}}>🤖</div>
            <div>
              <div style={{color:C.text,fontWeight:800,fontSize:"0.88rem"}}>김실장 AI 학습 코치</div>
              <div style={{color:"#16a34a",fontSize:10,display:"flex",alignItems:"center",gap:4}}><span style={{width:5,height:5,borderRadius:"50%",background:"#22c55e",display:"inline-block"}} />온라인</div>
            </div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={()=>setShowKeySetting(s=>!s)} style={{background:apiKey?"#ECFDF5":"#FFF1F2",border:"1px solid "+(apiKey?"#BBF7D0":"#FECDD3"),color:apiKey?"#16A34A":"#DC2626",borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontWeight:700}}>{apiKey?"🔑 연결됨":"🔑 키 설정"}</button>
            <button onClick={()=>setMsgs([initMsg])} style={{background:"rgba(0,0,0,0.05)",border:"1px solid rgba(0,0,0,0.08)",color:C.muted,borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>💡 초기화</button>
            <button onClick={onClose} style={{background:"rgba(0,0,0,0.06)",border:"none",color:C.muted,width:32,height:32,borderRadius:8,cursor:"pointer",fontSize:18}}>×</button>
          </div>
        </div>
        {showKeySetting&&(
          <div style={{padding:"14px 20px",background:"#F8FAFC",borderBottom:"1px solid rgba(0,0,0,0.07)"}}>
            <p style={{color:"#1E293B",fontWeight:800,fontSize:12,marginBottom:8}}>🔑 Anthropic API 키 설정</p>
            <p style={{color:"#64748B",fontSize:11,lineHeight:1.6,marginBottom:10}}>API 키는 이 기기의 브라우저에만 저장됩니다.<br/>키 발급: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{color:"#6366f1"}}>console.anthropic.com</a></p>
            <div style={{display:"flex",gap:7}}>
              <input value={keyInput} onChange={e=>setKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveKey()} placeholder="sk-ant-api03-..." style={{flex:1,background:"#fff",border:"1px solid rgba(0,0,0,0.12)",borderRadius:8,padding:"8px 11px",fontSize:12,outline:"none",fontFamily:"monospace"}} />
              <button onClick={saveKey} disabled={!keyInput.trim()} style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:8,padding:"8px 14px",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer",opacity:keyInput.trim()?1:0.5}}>저장</button>
            </div>
            {apiKey&&<button onClick={clearKey} style={{marginTop:8,background:"none",border:"none",color:"#DC2626",fontSize:11,cursor:"pointer",padding:0}}>× 현재 키 삭제</button>}
          </div>
        )}
        {!apiKey&&!showKeySetting&&(
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"30px 24px",background:"#F7F8FC",textAlign:"center"}}>
            <div style={{fontSize:40,marginBottom:12}}>🔑</div>
            <p style={{color:"#1E293B",fontWeight:800,fontSize:14,marginBottom:8}}>API 키를 연결해주세요</p>
            <p style={{color:"#64748B",fontSize:12,lineHeight:1.7,marginBottom:18}}>AI 코치를 사용하려면 Anthropic API 키가 필요합니다.<br/>키는 이 기기에만 안전하게 저장됩니다.</p>
            <button onClick={()=>setShowKeySetting(true)} style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:10,padding:"11px 24px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",boxShadow:"0 4px 14px rgba(99,102,241,0.4)"}}>🔑 API 키 설정하기</button>
            <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noreferrer" style={{marginTop:12,color:"#6366f1",fontSize:11}}>API 키 발급받기 →</a>
          </div>
        )}
        <div style={{flex:1,overflowY:"auto",padding:"15px 20px",display:"flex",flexDirection:"column",gap:12,background:"#F7F8FC",display:(!apiKey&&!showKeySetting)?"none":"flex"}}>
          {msgs.map((m,i)=>(
            <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",gap:8}}>
              {m.role==="assistant"&&<div style={{width:28,height:28,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0,marginTop:3}}>🤖</div>}
              <div style={{maxWidth:"78%",padding:"10px 14px",borderRadius:m.role==="user"?"15px 15px 4px 15px":"4px 15px 15px 15px",background:m.role==="user"?"linear-gradient(135deg,#6366f1,#8b5cf6)":"#fff",color:m.role==="user"?"#fff":C.text,boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>{renderM(m.content)}</div>
            </div>
          ))}
          {loading&&(
            <div style={{display:"flex",gap:8}}>
              <div style={{width:28,height:28,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#8b5cf6)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12}}>🤖</div>
              <div style={{padding:"10px 13px",background:"#fff",borderRadius:"4px 15px 15px 15px",display:"flex",gap:5,alignItems:"center",boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>
                {[0,1,2].map(j=><div key={j} style={{width:5,height:5,borderRadius:"50%",background:"#6366f1",animation:`db 1s ${j*0.2}s infinite`}} />)}
              </div>
            </div>
          )}
          <div ref={endRef} />
        </div>
        {msgs.length<=1&&(
          <div style={{padding:"7px 20px",display:"flex",flexWrap:"wrap",gap:5,background:"#fff",borderTop:"1px solid rgba(0,0,0,0.06)"}}>
            {quick.map(q=><button key={q} onClick={()=>send(q)} style={{background:"#EEF2FF",border:"1px solid rgba(99,102,241,0.22)",color:"#6366f1",borderRadius:100,padding:"4px 11px",fontSize:11,cursor:"pointer"}}>{q}</button>)}
          </div>
        )}
        {apiKey&&<div style={{padding:"9px 20px 15px",borderTop:"1px solid rgba(0,0,0,0.07)",display:"flex",gap:8,background:"#fff",flexShrink:0}}>
          <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="질문을 입력하세요..." style={{flex:1,background:"#F7F8FC",border:"1px solid rgba(0,0,0,0.08)",borderRadius:10,padding:"10px 13px",color:C.text,fontSize:13,outline:"none"}} />
          <button onClick={()=>send()} disabled={!input.trim()||loading} style={{background:"linear-gradient(135deg,#6366f1,#8b5cf6)",border:"none",borderRadius:10,padding:"10px 17px",color:"#fff",fontWeight:700,cursor:"pointer",fontSize:13,opacity:(!input.trim()||loading)?.5:1}}>전송</button>
        </div>}
      </div>
    </div>
  );
}

function Vault() {
  const [selLv,setSelLv]=useState("전체");
  const [selType,setSelType]=useState("전체");
  const [items,setItems]=useState(()=>{
    try{ return JSON.parse(localStorage.getItem("vault_items")||"[]"); }catch{ return []; }
  });
  const [showAdd,setShowAdd]=useState(false);
  const [showEdit,setShowEdit]=useState(null);
  const [editForm,setEditForm]=useState({lv:"L1",type:"예시프롬프트",title:"",desc:"",content:""});
  const [copied,setCopied]=useState("");
  const [form,setForm]=useState({lv:"L1",type:"예시프롬프트",title:"",desc:"",content:""});
  const [showContent,setShowContent]=useState(null);

  const allItems=[...VAULT_DEFAULT,...items];
  const filtered=allItems.filter(it=>{
    const lvOk=selLv==="전체"||it.lv===selLv;
    const typeOk=selType==="전체"||it.type===selType;
    return lvOk&&typeOk;
  });

  const saveItem=()=>{
    if(!form.title.trim()||!form.content.trim()) return;
    const newItem={...form,id:"u"+Date.now()};
    const updated=[...items,newItem];
    setItems(updated);
    localStorage.setItem("vault_items",JSON.stringify(updated));
    setForm({lv:"L1",type:"예시프롬프트",title:"",desc:"",content:""});
    setShowAdd(false);
  };

  const deleteItem=(id)=>{
    const updated=items.filter(it=>it.id!==id);
    setItems(updated);
    localStorage.setItem("vault_items",JSON.stringify(updated));
  };

  const openEdit=(it)=>{
    setEditForm({lv:it.lv,type:it.type,title:it.title,desc:it.desc||"",content:it.content});
    setShowEdit(it.id);
  };

  const updateItem=()=>{
    if(!editForm.title.trim()||!editForm.content.trim()) return;
    const updated=items.map(it=>it.id===showEdit?{...it,...editForm}:it);
    setItems(updated);
    localStorage.setItem("vault_items",JSON.stringify(updated));
    setShowEdit(null);
  };

  const copyText=(id,text)=>{
    navigator.clipboard.writeText(text).then(()=>{
      setCopied(id);
      setTimeout(()=>setCopied(""),2000);
    });
  };

  const typeColor={
    "예시프롬프트":"#6366F1","페르소나":"#0891B2","교육자료":"#059669"
  };
  const typeBg={
    "예시프롬프트":"#EEF2FF","페르소나":"#ECFEFF","교육자료":"#ECFDF5"
  };

  return (
    <section style={{padding:"80px 20px 60px",maxWidth:900,margin:"0 auto"}}>
      {/* 헤더 */}
      <div style={{textAlign:"center",marginBottom:36}}>
        <p style={{color:C.gold,fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:9}}>SECRET VAULT</p>
        <h2 style={{fontFamily:"'Pretendard',-apple-system,sans-serif",color:C.text,fontSize:"clamp(1.7rem,4vw,2.3rem)",fontWeight:900,marginBottom:10}}>🔐 비밀서류함</h2>
        <p style={{color:C.muted,fontSize:14,lineHeight:1.7,marginBottom:0}}>LV별 예시프롬프트 · 페르소나 · 교육자료 모음</p>
      </div>

      {/* LV 필터 */}
      <div style={{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center",marginBottom:14}}>
        {VAULT_LEVELS.map(lv=>(
          <button key={lv} onClick={()=>setSelLv(lv)} style={{
            border:"none",borderRadius:20,padding:"6px 15px",cursor:"pointer",fontWeight:700,fontSize:12,
            background:selLv===lv?(lv==="전체"?C.gold:VAULT_COLORS[lv]||C.gold):"rgba(0,0,0,0.06)",
            color:selLv===lv?"#fff":C.muted,transition:"all .2s"
          }}>{lv}</button>
        ))}
      </div>

      {/* 타입 필터 */}
      <div style={{display:"flex",flexWrap:"wrap",gap:7,justifyContent:"center",marginBottom:28}}>
        {VAULT_TYPES.map(t=>(
          <button key={t} onClick={()=>setSelType(t)} style={{
            border:`1.5px solid ${selType===t?(typeColor[t]||C.gold):"rgba(0,0,0,0.1)"}`,
            borderRadius:20,padding:"5px 14px",cursor:"pointer",fontWeight:600,fontSize:11,
            background:selType===t?(typeBg[t]||"rgba(217,119,6,0.1)"):"#fff",
            color:selType===t?(typeColor[t]||C.gold):C.muted,transition:"all .2s"
          }}>{t}</button>
        ))}
      </div>

      {/* 카드 그리드 */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:16,marginBottom:32}}>
        {filtered.map(it=>(
          <div key={it.id} style={{background:"#fff",border:"1px solid rgba(0,0,0,0.08)",borderRadius:16,padding:"18px 18px 14px",boxShadow:"0 2px 10px rgba(0,0,0,0.05)",display:"flex",flexDirection:"column",gap:8}}>
            {/* 배지 */}
            <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
              <span style={{background:VAULT_COLORS[it.lv]||C.gold,color:"#fff",fontSize:10,fontWeight:800,borderRadius:20,padding:"2px 9px"}}>{it.lv}</span>
              <span style={{background:typeBg[it.type]||"#F5F3FF",color:typeColor[it.type]||C.gold,fontSize:10,fontWeight:700,borderRadius:20,padding:"2px 9px"}}>{it.type}</span>
              {it.id.startsWith("u")&&<span style={{background:"#FEF3C7",color:"#92400E",fontSize:10,fontWeight:700,borderRadius:20,padding:"2px 9px"}}>내 자료</span>}
            </div>
            {/* 제목 */}
            <p style={{color:C.text,fontWeight:800,fontSize:13,margin:0,lineHeight:1.4}}>{it.title}</p>
            {/* 설명 */}
            {it.desc&&<p style={{color:C.muted,fontSize:11,margin:0,lineHeight:1.6}}>{it.desc}</p>}
            {/* 버튼 */}
            <div style={{display:"flex",gap:7,marginTop:4}}>

                <p style={{color:C.text,fontWeight:700,fontSize:13,margin:0,lineHeight:1.5}}>{item.q}</p>
              </div>
              <span style={{color:C.faint,fontSize:16,flexShrink:0,transition:"transform .2s",transform:openId===item.id?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
            </div>
            {/* 답변 영역 */}
            {openId===item.id&&(
              <div style={{borderTop:"1px solid rgba(0,0,0,0.06)",padding:"16px 18px",background:"#FAFAFA"}}>
                <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                  <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${C.gold},${C.goldL})`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontFamily:"'Pretendard',-apple-system,sans-serif",fontWeight:900,fontSize:11,color:"#fff"}}>김</div>
                  <div style={{flex:1}}>
                    <p style={{color:C.gold,fontWeight:800,fontSize:11,margin:"0 0 6px"}}>김실장 · 운영자 답변</p>
                    <p style={{color:C.muted,fontSize:13,lineHeight:1.8,margin:0}}>{item.a}</p>
                  </div>
                </div>
              </div>
            )}
          </div>
        ))}
        {filtered.length===0&&(
          <div style={{textAlign:"center",padding:"48px 20px",color:C.faint}}>
            <div style={{fontSize:36,marginBottom:12}}>📭</div>
            <p style={{fontSize:14}}>해당 카테고리의 Q&A가 없습니다</p>
          </div>
        )}
      </div>

      {/* 질문 작성 모달 */}
      {showForm&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e=>{if(e.target===e.currentTarget){setShowForm(false);setSubmitted(false);}}}>
          <div style={{background:"#fff",borderRadius:20,padding:"28px 26px",width:"100%",maxWidth:480,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 60px rgba(0,0,0,0.2)"}}>
            {!submitted?(
              <>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
                  <h3 style={{fontFamily:"'Pretendard',-apple-system,sans-serif",fontWeight:900,fontSize:"1.1rem",color:C.text}}>✏️ 질문 작성</h3>
                  <button onClick={()=>setShowForm(false)} style={{background:"none",border:"none",fontSize:20,cursor:"pointer",color:C.faint}}>✕</button>
                </div>
                <form onSubmit={handleSubmit}>
                  <div style={{marginBottom:14}}>
                    <label style={{display:"block",color:C.muted,fontSize:12,fontWeight:700,marginBottom:5}}>이름 *</label>
                    <input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="홍길동" style={{width:"100%",border:"1px solid rgba(0,0,0,0.12)",borderRadius:10,padding:"10px 13px",fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={{display:"block",color:C.muted,fontSize:12,fontWeight:700,marginBottom:5}}>이메일 * (답변 수신)</label>
                    <input required type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="example@company.com" style={{width:"100%",border:"1px solid rgba(0,0,0,0.12)",borderRadius:10,padding:"10px 13px",fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={{display:"block",color:C.muted,fontSize:12,fontWeight:700,marginBottom:5}}>카테고리</label>
                    <select value={form.cat} onChange={e=>setForm({...form,cat:e.target.value})} style={{width:"100%",border:"1px solid rgba(0,0,0,0.12)",borderRadius:10,padding:"10px 13px",fontSize:13,fontFamily:"inherit",outline:"none",background:"#fff",boxSizing:"border-box"}}>
                      {["AI 학습","프롬프트","앱/기술","기타"].map(c=><option key={c}>{c}</option>)}
                    </select>
                  </div>
                  <div style={{marginBottom:14}}>
                    <label style={{display:"block",color:C.muted,fontSize:12,fontWeight:700,marginBottom:5}}>제목 *</label>
                    <input required value={form.title} onChange={e=>setForm({...form,title:e.target.value})} placeholder="질문 제목을 입력해 주세요" style={{width:"100%",border:"1px solid rgba(0,0,0,0.12)",borderRadius:10,padding:"10px 13px",fontSize:13,fontFamily:"inherit",outline:"none",boxSizing:"border-box"}}/>
                  </div>
                  <div style={{marginBottom:20}}>
                    <label style={{display:"block",color:C.muted,fontSize:12,fontWeight:700,marginBottom:5}}>질문 내용 *</label>
                    <textarea required value={form.body} onChange={e=>setForm({...form,body:e.target.value})} placeholder="궁금한 내용을 자세히 적어주세요" rows={5} style={{width:"100%",border:"1px solid rgba(0,0,0,0.12)",borderRadius:10,padding:"10px 13px",fontSize:13,fontFamily:"inherit",outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
                  </div>
                  <button type="submit" style={{width:"100%",background:`linear-gradient(135deg,${C.gold},${C.goldL})`,border:"none",borderRadius:12,padding:"13px",color:"#fff",fontWeight:900,fontSize:"0.97rem",cursor:"pointer",fontFamily:"inherit",boxShadow:"0 6px 18px rgba(217,119,6,.3)"}}>질문 전송하기 →</button>
                  <p style={{color:C.faint,fontSize:11,textAlign:"center",marginTop:10}}>이메일 클라이언트가 열리며 전송됩니다</p>
                </form>
              </>
            ):(
              <div style={{textAlign:"center",padding:"20px 0"}}>
                <div style={{fontSize:52,marginBottom:16}}>✅</div>
                <h3 style={{fontFamily:"'Pretendard',-apple-system,sans-serif",fontWeight:900,color:C.text,marginBottom:10}}>질문이 접수됐습니다!</h3>
                <p style={{color:C.muted,fontSize:13,lineHeight:1.8,marginBottom:24}}>입력하신 이메일로 영업일 기준<br/><strong style={{color:C.gold}}>24시간 내</strong> 답변드리겠습니다.</p>
                <button onClick={()=>{setShowForm(false);setSubmitted(false);setForm({name:"",email:"",cat:"AI 학습",title:"",body:""});}} style={{background:C.gold,border:"none",borderRadius:12,padding:"11px 28px",color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>확인</button>
              </div>
            )}
          </div>
        </div>
      )}
    </section>
  );
}

// ─── APP ───
function App() {
  const [sec,setSec]=useState("home");
  const [selMod,setSelMod]=useState(null);
  const [showCoach,setShowCoach]=useState(false);
  const {done,pct,complete,reset,earned}=useProgress();

  const go=s=>{
    if (s==="coach"){setShowCoach(true);return;}
    setSec(s);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  return (
    <div style={{fontFamily:"'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif",background:C.bg,minHeight:"100vh"}}>
      <GS />
      <Nav sec={sec} go={go} />
      <div style={{paddingTop:60}}>
        {sec==="home"&&<><NoticeBanner go={go} /><PptBanner go={go} /><Hero pct={pct} go={go} /><Story pct={pct} done={done} /><CTA go={go} /><Footer go={go} /></>}
        {sec==="story"&&<><Story pct={pct} done={done} /><CTA go={go} /><Footer go={go} /></>}
        {sec==="learning"&&<><Learning done={done} openMod={setSelMod} /><Footer go={go} /></>}
        {sec==="progress"&&<><Progress done={done} pct={pct} earned={earned} reset={reset} go={go} /><Footer go={go} /></>}
        {sec==="board"&&<><Board /><Footer go={go} /></>}
        {sec==="vault"&&<><Vault /><Footer go={go} /></>}
        {sec==="notebook"&&<><NotebookLMLecture go={go} /><Footer go={go} /></>}
        {sec==="ppt"&&<><PptMagic go={go} /><Footer go={go} /></>}
      </div>
      {selMod&&<ModModal mod={selMod} done={done} onClose={()=>setSelMod(null)} onComplete={complete} />}
      <AnnouncementPopup go={go} />
    </div>
  );
}

const { useState, useEffect, useRef, useCallback } = React;
const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(App));
